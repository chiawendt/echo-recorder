<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="diskGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#b08080;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8a6565;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6e5252;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c9a5a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88888;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Outer disk -->
  <circle cx="50" cy="50" r="48" fill="url(#diskGradient)" stroke="#5a4444" stroke-width="2"/>
  
  <!-- Inner reflection rings for vinyl effect -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#8a6565" stroke-width="0.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#8a6565" stroke-width="0.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#8a6565" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Center hole -->
  <circle cx="50" cy="50" r="12" fill="url(#centerGradient)" stroke="#6e5252" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="6" fill="#3d2e2e" stroke="#5a4444" stroke-width="1"/>
</svg>

